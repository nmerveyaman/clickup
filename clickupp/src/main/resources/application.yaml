spring:
  application:
    name: demo
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/clıckup_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Postgres123!}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "1"
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

server:
  port: ${PORT:8080}

clickup:
  api:
    base-url: "https://api.clickup.com/api/v2"
    token: "${CLICKUP_API_TOKEN:}"
    endpoints:
      teams: "/team"
      spaces: "/team/{teamId}/space"
      folders: "/space/{spaceId}/folder"
      space_list: "/space/{spaceId}/list"
      tasks: "/team/{teamId}/task"

  oauth:
    client-id: "${CLICKUP_CLIENT_ID:HS5OHKC0BN49JG7RPE3FQZ6E36DZ5C0T}"
    client-secret: "${CLICKUP_CLIENT_SECRET}"
    redirect-uri: "${CLICKUP_REDIRECT_URI:http://localhost:8080/callback}"