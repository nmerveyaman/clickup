spring:
  application:
    name: demo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clıckup_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Postgres123!}

  #flyway:
    #enabled: true
    #locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

clickup:
  api:
    base-url: "https://api.clickup.com/api/v2"
    token: "${CLICKUP_API_TOKEN}"
    endpoints:
      teams: "/team"
      spaces: "/team/{teamId}/space"
      folders: "/space/{spaceId}/folder"
      #folder_list: "/folder/{folderId}/list"
      space_list: "/space/{spaceId}/list"
      tasks: "/team/{teamId}/task"
  oauth:
    client-id: "${CLICKUP_CLIENT_ID:BURAYA_CLIENT_ID_YAZ}"
    client-secret: "${CLICKUP_CLIENT_SECRET:BURAYA_CLIENT_SECRET_YAZ}"
    redirect-uri: "${CLICKUP_REDIRECT_URI:http://localhost:8080/callback}"